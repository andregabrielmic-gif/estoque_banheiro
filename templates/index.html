<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estoque RH</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 20px; 
            background: #f8f9fa; 
            border-bottom: 2px solid #dee2e6;
            margin-bottom: 20px;
        }
        .top-bar { margin-bottom: 20px; }
        .botao { 
            background-color: #4CAF50; color: white; padding: 10px 15px; 
            text-decoration: none; border-radius: 4px; margin-right: 10px;
        }
        .busca-container { text-align: center; margin: 20px 0; }
        .busca-container input { width: 300px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .lista { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 20px; 
        }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; background: white; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0;">📦 Controle de Estoque</h1>
    <div>
        <label for="filtroCat"><strong>Categoria:</strong></label>
        <select id="filtroCat" onchange="filtrarTudo()">
            <option value="">Todas</option>
            <option value="Brindes">Brindes</option>
            <option value="Insumos">Insumos</option>
            <option value="Uniformes Administrativo">Uniformes Administrativo</option>
            <option value="Uniformes Operacionais">Uniformes Operacionais</option>
            <option value="EPI's">EPI's</option>
        </select>
    </div>
</header>

<div class="top-bar">
    <a class="botao" href="/novo">➕ Novo Item</a>
    <a class="botao" href="/relatorio" style="background-color: #2196F3;">📄 Relatório</a>
</div>

<div class="busca-container">
    <input type="text" id="busca" placeholder="Buscar por nome..." onkeyup="filtrarTudo()">
</div>

<div class="lista" id="listaItens">
    {% for item in itens %}
    <div class="card" data-nome="{{ item['nome']|lower }}" data-cat="{{ item['categoria'] }}">
        {% if item['foto'] %}
            <img src="/static/fotos/{{ item['foto'] }}">
        {% endif %}
        <h2>{{ item['nome'] }}</h2>
        <p><strong>Categoria:</strong> {{ item['categoria'] }}</p>
        <p><strong>Armário:</strong> {{ item['armario'] }}</p>
        <p><strong>Quantidade:</strong> {{ item['quantidade'] }}</p>
        <a href="/item/{{ item['id'] }}">Ver detalhes</a>
    </div>
    {% endfor %}
</div>

<script>
function filtrarTudo() {
    let texto = document.getElementById('busca').value.toLowerCase();
    let cat = document.getElementById('filtroCat').value;
    
    document.querySelectorAll('.card').forEach(card => {
        let nome = card.dataset.nome;
        let categoria = card.dataset.cat;
        
        let bateTexto = nome.includes(texto);
        let bateCat = (cat === "" || categoria === cat);
        
        card.style.display = (bateTexto && bateCat) ? 'block' : 'none';
    });
}
</script>
</body>
</html>
