<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estoque RH</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #121212; color: white; }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 30px; 
            background: #1e1e1e; 
            border-bottom: 1px solid #333;
        }

        .filtros-topo { display: flex; align-items: center; gap: 10px; }
        
        select { 
            padding: 6px; border-radius: 4px; border: 1px solid #444; 
            background: #2d2d2d; color: white; font-size: 14px; cursor: pointer;
        }

        .top-bar { padding: 20px; text-align: center; }
        .botao { 
            background-color: #4CAF50; color: white; padding: 10px 15px; 
            text-decoration: none; border-radius: 4px; margin: 0 5px; font-weight: bold;
        }

        .busca-container { text-align: center; margin-bottom: 30px; }
        .busca-container input { 
            width: 320px; padding: 12px; border: 1px solid #444; 
            border-radius: 4px; background: #1e1e1e; color: white; 
        }

        .lista { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 20px; padding: 0 20px 40px;
        }

        /* Card Normal */
        .card { border: 1px solid #333; border-radius: 8px; padding: 15px; text-align: center; background: #1e1e1e; position: relative; }
        
        /* Card quando o item está zerado */
        .card.zerado { border: 2px solid #ff4d4d; background: #2a1a1a; }

        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; margin-bottom: 10px; }
        
        /* Alerta visual de compra */
        .alerta-compra {
            background-color: #ff4d4d;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            position: absolute;
            top: 10px;
            right: 10px;
            text-transform: uppercase;
        }

        .card h2 { font-size: 1.2rem; margin: 10px 0; }
        .card a { color: #2196F3; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0; font-size: 1.4rem;">📦 Controle de Estoque</h1>
    <div class="filtros-topo">
        <label for="filtroCat">Categoria:</label>
        <select id="filtroCat" onchange="filtrarTudo()">
            <option value="">Todas</option>
            <option value="Brindes">Brindes</option>
            <option value="Insumos">Insumos</option>
            <option value="Uniformes Administrativo">Uniformes Administrativo</option>
            <option value="Uniformes Operacionais">Uniformes Operacionais</option>
            <option value="EPI's">EPI's</option>
        </select>
    </div>
</header>

<div class="top-bar">
    <a class="botao" href="/novo">➕ Novo Item</a>
    <a class="botao" href="/relatorio" style="background-color: #2196F3;">📄 Relatório</a>
</div>

<div class="busca-container">
    <input type="text" id="busca" placeholder="Buscar por nome..." onkeyup="filtrarTudo()">
</div>

<div class="lista" id="listaItens">
    {% for item in itens %}
    <div class="card {% if item['quantidade'] <= 0 %}zerado{% endif %}" 
         data-nome="{{ item['nome']|lower }}" 
         data-cat="{{ item['categoria'] }}">
        
        {% if item['quantidade'] <= 0 %}
            <div class="alerta-compra">⚠️ COMPRAR</div>
        {% endif %}

        {% if item['foto'] %}
            <img src="/static/fotos/{{ item['foto'] }}">
        {% endif %}
        
        <h2>{{ item['nome'] }}</h2>
        <p><span style="color: #888;">Categoria:</span> {{ item['categoria'] }}</p>
        <p><span style="color: #888;">Qtd:</span> 
            <strong style="color: {% if item['quantidade'] <= 0 %}#ff4d4d{% else %}#4CAF50{% endif %};">
                {{ item['quantidade'] }}
            </strong>
        </p>
        <a href="/item/{{ item['id'] }}" style="color: #2196F3; text-decoration: none; font-weight: bold;">
    Ver detalhes / Movimentar
</a>
    </div>
    {% endfor %}
</div>

<script>
function filtrarTudo() {
    let texto = document.getElementById('busca').value.toLowerCase();
    let cat = document.getElementById('filtroCat').value;
    
    document.querySelectorAll('.card').forEach(card => {
        let nome = card.dataset.nome;
        let categoria = card.dataset.cat;
        
        let bateTexto = nome.includes(texto);
        let bateCat = (cat === "" || categoria === cat);
        
        card.style.display = (bateTexto && bateCat) ? 'block' : 'none';
    });
}
</script>
</body>
</html>
