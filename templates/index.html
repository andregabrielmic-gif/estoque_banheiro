<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estoque RH</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header><h1>📦 Controle de Estoque RH</h1></header>
    
    <div style="text-align:center; margin: 20px;">
        <a class="botao" href="/novo">➕ Novo Item</a>
        <a class="botao" href="/relatorio">📄 Relatório</a>
    </div>

    <div style="text-align: center; margin-bottom: 20px;">
        <button onclick="filtrarCat('')">Todos</button>
        <button onclick="filtrarCat('brindes')">Brindes</button>
        <button onclick="filtrarCat('insumos')">Insumos</button>
        <button onclick="filtrarCat('epi')">EPI's</button>
    </div>

    <div class="busca-container">
        <input type="text" id="busca" placeholder="Buscar por nome..." onkeyup="filtrarItens()">
    </div>

    <div class="lista" id="listaItens">
        {% for item in itens %}
        <div class="card" data-nome="{{ item['nome']|lower }}" data-cat="{{ item['categoria']|lower }}">
            {% if item['foto'] %}<img src="/static/fotos/{{ item['foto'] }}">{% endif %}
            <h2>{{ item['nome'] }}</h2>
            <p><strong>Categoria:</strong> {{ item['categoria'] }}</p>
            <p><strong>Quantidade:</strong> {{ item['quantidade'] }}</p>
            <a href="/item/{{ item['id'] }}">Ver detalhes</a>
        </div>
        {% endfor %}
    </div>

    <script>
        function filtrarCat(c) {
            document.getElementById('busca').value = c;
            filtrarItens();
        }
        function filtrarItens() {
            let t = document.getElementById('busca').value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => {
                let match = c.dataset.nome.includes(t) || c.dataset.cat.includes(t);
                c.style.display = match ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
