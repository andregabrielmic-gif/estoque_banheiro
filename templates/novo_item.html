<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Item</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Cadastrar Novo Item</h1>
    <form method="POST" enctype="multipart/form-data">
        <label>Nome:</label><br>
        <input type="text" name="nome" required style="width: 100%; max-width: 400px; padding: 8px;"><br><br>

        <label>Descrição:</label><br>
        <textarea name="descricao" style="width: 100%; max-width: 400px; padding: 8px;"></textarea><br><br>

        <label>Categoria:</label><br>
        <select name="categoria" required style="width: 100%; max-width: 418px; padding: 8px;">
            <option value="">Selecione...</option>
            <option value="Brindes">Brindes</option>
            <option value="Insumos">Insumos</option>
            <option value="Uniformes Administrativo">Uniformes Administrativo</option>
            <option value="Uniformes Operacionais">Uniformes Operacionais</option>
            <option value="EPI's">EPI's</option>
        </select><br><br>

        <label>Armário:</label><br>
        <input type="text" name="armario" required style="width: 100%; max-width: 400px; padding: 8px;"><br><br>

        <label>Quantidade Inicial:</label><br>
        <input type="number" name="quantidade" value="0" required style="width: 100%; max-width: 400px; padding: 8px;"><br><br>

        <label>Foto:</label><br>
        <input type="file" name="foto" accept="image/*" required><br><br>

        <button type="submit" style="background: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer;">Salvar Item</button>
    </form>
    <br><a href="/">⬅ Voltar</a>
</body>
</html>
