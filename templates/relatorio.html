<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Estoque</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <h1>📄 Relatório de Estoque</h1>
</header>

<a class="botao" href="/">⬅ Voltar</a>

<table>
    <tr>
        <th>Item</th>
        <th>Armário</th>
        <th>Quantidade</th>
        <th>Categoria</th>
    </tr>

    {% for item in itens %}
    <tr>
        <td>{{ item[0] }}</td>
        <td>{{ item[1] }}</td>
        <td>{{ item[2] }}</td>
        <td>{{ item[3] }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
